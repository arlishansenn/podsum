# 仅供 stock Reactor CLI diagnostics（doctor/compile/topology/DevTools）；不是 production authority。
# production contracts 由 wrapper 的 PODSUM_REACTOR_CONTRACTS_DIR 和 daemon --contracts 明确传入。
state:
  dir: .reactor

model:
  provider: openai
  api_key_env: OPENAI_API_KEY
  base_url: http://100.64.0.5:4000/v1
  render_model: newapi/gpt-5.5
  compile_model: newapi/gpt-5.5
  max_turns: 200

sandbox:
  mode: none
  shell_timeout_ms: 300000

gateways:
  - node: email-evidence-gateway
    source_id: email-evidence
    connector:
      type: static
      id_field: commit.pack_id
      items: []

reactors: []
